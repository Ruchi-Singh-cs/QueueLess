# Render Blueprint. Dashboard -> New -> Blueprint -> this repo. Values marked sync: false are prompted for.
services:
  - type: web
    name: queueless
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO
        value: "1"                      # stages the demo on every boot; switch to SEED=1 (shops only) or remove for real data
      - key: MONGO_URI
        sync: false                     # Atlas connection string (Network Access must allow 0.0.0.0/0)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false                     # cd server && npm run vapid
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      - key: SEED_LAT
        value: "26.8492"
      - key: SEED_LNG
        value: "80.8586"
      - key: SEED_CITY
        value: Lucknow
      - key: SEED_STATE
        value: Uttar Pradesh
      - key: SEED_PINCODE
        value: "226001"
      - key: SEED_EXTRA
        value: "100"
      - key: SEED_RADIUS_KM
        value: "60"
